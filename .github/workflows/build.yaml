name: Build add-on images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
        addon:
          - target: stellantis_vehicles
            image: stellantis-vehicles
          - target: stellantis_login_worker
            image: stellantis-login-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read add-on version
        id: version
        run: echo "version=$(grep '^version:' ${{ matrix.addon.target }}/config.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on image
        uses: home-assistant/builder@250ea2192b6df8ba411f158b5b6c13e09e657eff # 2026-10-07
        with:
          args: |
            ${{ github.event_name == 'pull_request' && '--test' || '' }} \
            --${{ matrix.arch }} \
            --target ${{ matrix.addon.target }} \
            --image ${{ matrix.addon.image }}-${{ matrix.arch }} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon
